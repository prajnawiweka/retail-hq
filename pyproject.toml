[project]
name = "retail-hq"
version = "0.1.0"
description = "Retail HQ Multi-Agent Analytics - generator data dummy (50 toko Bali, 2 tahun)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-bigquery>=1.10,<2",
    "dbt-core>=1.11,<1.12",
    "google-cloud-bigquery>=3.25",
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.scripts]
generate-data = "retailhq_data.__main__:main"
load-bq = "retailhq_data.load_bq:main"
dbt-rhq = "retailhq_data.dbt_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retailhq_data"]

[tool.uv]
# cryptography >= 49 tidak lagi menyediakan wheel untuk Mac Intel (x86_64),
# sehingga harus dikompilasi dan gagal. Kunci ke versi 48 khusus Mac Intel.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
