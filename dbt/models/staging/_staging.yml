version: 2

models:
  - name: stg_store
    columns:
      - name: store_code
        data_tests:
          - unique
          - not_null
      - name: location_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['wisata', 'perumahan', 'jalan utama', 'dekat kampus']
      - name: store_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['reguler', 'QSR']
  - name: stg_product
    columns:
      - name: sku
        data_tests:
          - unique
          - not_null
      - name: supplier_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_supplier')
                field: supplier_id
  - name: stg_supplier
    columns:
      - name: supplier_id
        data_tests:
          - unique
          - not_null
  - name: stg_sales_daily
    data_tests:
      - unique_combination:
          arguments:
            columns: [sales_date, store_code]
    columns:
      - name: sales_date
        data_tests:
          - not_null
      - name: store_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_store')
                field: store_code
  - name: stg_sales_category_daily
    data_tests:
      - unique_combination:
          arguments:
            columns: [sales_date, store_code, category]
    columns:
      - name: sales_date
        data_tests:
          - not_null
      - name: store_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_store')
                field: store_code
      - name: category
        data_tests:
          - not_null
  - name: stg_sales_sku_weekly
    data_tests:
      - unique_combination:
          arguments:
            columns: [week_start, store_code, sku]
    columns:
      - name: week_start
        data_tests:
          - not_null
      - name: store_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_store')
                field: store_code
      - name: sku
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_product')
                field: sku
  - name: stg_stock_weekly
    data_tests:
      - unique_combination:
          arguments:
            columns: [week_start, store_code, sku]
    columns:
      - name: week_start
        data_tests:
          - not_null
      - name: store_code
        data_tests:
          - not_null
          - relationships:
