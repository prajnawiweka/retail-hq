                to: ref('stg_store')
                field: store_code
      - name: sku
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_product')
                field: sku
  - name: stg_fixture
    columns:
      - name: fixture_id
        data_tests:
          - unique
          - not_null
      - name: store_code
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_store')
                field: store_code
  - name: stg_planogram
